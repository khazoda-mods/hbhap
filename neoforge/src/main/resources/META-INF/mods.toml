modLoader = "lowcodefml"
loaderVersion = "${neoforge_loader_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/khazoda-mods/hbhap/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
logoFile = "assets/${mod_id}/banner.png"
logoBlur = false
displayName = "${mod_name}"
displayURL = "https://khazoda.com#hbhap"
issueTrackerURL = "https://github.com/khazoda-mods/hbhap/issues"
authors = "${mod_author}"
displayTest = "IGNORE_ALL_VERSION"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range_neoforge}"
ordering = "NONE"
side = "CLIENT"

[modproperties.${mod_id}]
catalogueImageIcon = "assets/${mod_id}/icon.png"
catalogueBackground = "assets/${mod_id}/background.png"
